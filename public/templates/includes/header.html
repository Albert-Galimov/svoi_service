{# Партиал: шапка сайта. Подключается в base.html. #}

<header class="site-header">
    <div class="container site-header__inner">
        <a href="{% url 'public:home' %}" class="site-header__logo">{{ contacts.company_name }}</a>

        {# Кнопка-бургер — видна только на мобильных #}
        <button type="button"
                class="site-header__toggle"
                aria-label="Открыть меню"
                aria-expanded="false"
                aria-controls="site-nav">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="site-nav" id="site-nav">
            <a href="{% url 'public:home' %}#services">Услуги</a>
            <a href="{% url 'public:home' %}#advantages">Преимущества</a>
            <a href="{% url 'public:home' %}#contacts">Контакты</a>
            <a href="{% url 'public:home' %}#booking" class="btn btn--accent btn--small">Записаться</a>
        </nav>
    </div>
</header>

<script>
(function () {
    var toggle = document.querySelector('.site-header__toggle');
    var nav = document.getElementById('site-nav');
    if (!toggle || !nav) return;

    toggle.addEventListener('click', function () {
        var isOpen = nav.classList.toggle('is-open');
        toggle.classList.toggle('is-active', isOpen);
        toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    // Закрываем меню при клике на ссылку (клиент всё равно уйдёт по якорю).
    nav.addEventListener('click', function (e) {
        if (e.target.tagName === 'A') {
            nav.classList.remove('is-open');
            toggle.classList.remove('is-active');
            toggle.setAttribute('aria-expanded', 'false');
        }
    });
})();
</script>
