{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ремонт автомобилей в Казани: диагностика, замена масла, тормоза, ходовая. Точная цена после осмотра.">
    <title>{% block title %}{{ contacts.company_name }} — ремонт авто в Казани{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header class="site-header">
    <div class="container site-header__inner">
        <a href="{% url 'public:home' %}" class="site-header__logo">{{ contacts.company_name }}</a>

        <nav class="site-nav">
            <a href="#services">Услуги</a>
            <a href="#advantages">Преимущества</a>
            <a href="#contacts">Контакты</a>
            <a href="#contacts" class="btn btn--accent btn--small">Записаться</a>
        </nav>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <div class="container site-footer__inner">
        <div>
            &copy; {% now "Y" %} {{ contacts.company_name }}. Казань.
        </div>
        <div>
            <a href="tel:{{ contacts.phone_raw }}">{{ contacts.phone_display }}</a>
        </div>
    </div>
</footer>

</body>
</html>
