<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Автосервис в Казани{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
        header { background: #1a2b4a; color: #fff; padding: 16px 32px; }
        header a { color: #fff; text-decoration: none; font-weight: bold; }
        main { max-width: 900px; margin: 32px auto; padding: 0 16px; }
        footer { text-align: center; padding: 24px; color: #888; font-size: 14px; }
        h1 { color: #1a2b4a; }
    </style>
</head>
<body>
    <header>
        <a href="/">Автосервис «Svoi Service»</a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        © {% now "Y" %} Автосервис. Казань.
    </footer>
</body>
</html>
