[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    */migrations/*.py,
    venv,
    .venv
max-complexity = 10

[isort]
profile = black
line_length = 88
known_django = django
known_first_party = crm,core,public
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
skip_glob = */migrations/*.py
